<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ConsolasFallback,Consolas,monospace" width="1140px" height="560px" viewBox="0 0 1140 560" font-size="15px">
<defs>
  <!-- Animated Glowing Neon Outer Border -->
  <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00f5ff"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#ff007f"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- Dash Portrait Cyber Gradient -->
  <linearGradient id="dashHolo" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00f5ff"/>
    <stop offset="50%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>

  <!-- Scanline Gradient -->
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
  </linearGradient>

  <!-- Neon Drop Shadow Filter -->
  <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8b5cf6" flood-opacity="0.5"/>
  </filter>

  <!-- Animated Typing Headline Paths -->
  <path id="typePath1">
    <animate id="t1" attributeName="d" begin="0s;t3.end+1.5s" dur="4.5s" fill="freeze"
      values="m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0" keyTimes="0; 0.55; 0.85; 1"/>
  </path>
  <path id="typePath2">
    <animate id="t2" attributeName="d" begin="t1.end" dur="4.5s" fill="freeze"
      values="m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0" keyTimes="0; 0.55; 0.85; 1"/>
  </path>
  <path id="typePath3">
    <animate id="t3" attributeName="d" begin="t2.end" dur="4.5s" fill="freeze"
      values="m0,20 h0 ; m0,20 h520 ; m0,20 h520 ; m0,20 h0" keyTimes="0; 0.55; 0.85; 1"/>
  </path>

  <!-- ClipPath for Streaming Terminal Typing Effect -->
  <clipPath id="typingStreamClip">
    <rect x="410" y="80" width="710" height="0">
      <animate attributeName="height" values="0; 460; 460; 0" keyTimes="0; 0.45; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  -webkit-size-adjust: 109%;
  size-adjust: 109%;
}
.key {fill: #ffa657;}
.value {fill: #a5d6ff;}
.addColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.cc {fill: #616e7f;}
.neonPrompt {fill: #00f5ff; font-weight: bold;}
.accentHead {fill: #ff007f; font-weight: bold;}
.quoteText {fill: #a78bfa; font-style: italic;}
.cursor {fill: #00f5ff;}
.dashFrame {stroke: #00f5ff; stroke-width: 1.2; stroke-dasharray: 6,4; fill: none; opacity: 0.75;}
text, tspan {white-space: pre;}
</style>

<!-- Outer Glowing Neon Border -->
<rect x="2" y="2" width="1136" height="556" rx="18" fill="none" stroke="url(#neonBorder)" stroke-width="2.2" filter="url(#neonGlow)"/>

<!-- Inner Solid Card Body -->
<rect x="4" y="4" width="1132" height="552" rx="16" fill="#0d1117"/>

<!-- Real Terminal Chrome Titlebar -->
<circle cx="28" cy="24" r="6" fill="#ff5f56"/>
<circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
<circle cx="68" cy="24" r="6" fill="#27c93f"/>
<text x="96" y="28" fill="#8b949e" font-size="12px">puranjay@salaria:~ (zsh)</text>

<!-- Top Right Live Status Indicators -->
<circle cx="985" cy="24" r="4.5" fill="#00ff9d">
  <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="996" y="28" fill="#00ff9d" font-size="11px" font-weight="bold">ONLINE</text>
<text x="1060" y="28" fill="#8b949e" font-size="12px">[utf-8]</text>

<!-- Divider Line -->
<line x1="16" y1="42" x2="1124" y2="42" stroke="#30363d" stroke-width="1"/>

<!-- ========================================== -->
<!-- LEFT: DASH PORTRAIT WITH DASHED CYBER BOX  -->
<!-- ========================================== -->
<!-- Dashed wireframe container frame -->
<rect x="20" y="55" width="370" height="490" rx="10" class="dashFrame"/>
<text x="32" y="51" fill="#00f5ff" font-size="11px" font-weight="bold">[ PHOTO // WIREFRAME_DASHES ]</text>

<!-- Holographic Scanline Over Dash Portrait -->
<line x1="22" y1="56" x2="388" y2="56" stroke="url(#scanGrad)" stroke-width="2">
  <animate attributeName="y1" values="56;540;56" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="56;540;56" dur="9s" repeatCount="indefinite"/>
</line>

<!-- Dash-Based ASCII Portrait Matrix -->
<text x="30" y="78" fill="url(#dashHolo)" class="ascii">
