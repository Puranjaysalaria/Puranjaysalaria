<!-- Moving Cyan Typing Line Indicator -->
<line x1="410" y1="80" x2="1080" y2="80" stroke="#00f5ff" stroke-width="1.8" opacity="0.75">
  <animate attributeName="y1" values="80; 545; 545; 80" keyTimes="0; 0.45; 0.95; 1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="80; 545; 545; 80" keyTimes="0; 0.45; 0.95; 1" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.85; 0; 0; 0.85" keyTimes="0; 0.45; 0.95; 1" dur="10s" repeatCount="indefinite"/>
