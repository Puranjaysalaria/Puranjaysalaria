<tspan x="30" y="534"> .============-----==============---++</tspan>
</text>

<!-- ========================================== -->
<!-- RIGHT: TYPING EFFECT TERMINAL PANEL       -->
<!-- ========================================== -->

<!-- 1. Typing Command Prompt & Rotating Role Carousel -->
<text x="410" y="65" fill="#00f5ff" font-weight="bold" font-size="15px">puranjay@salaria:~$</text>

<!-- Animated Typewriter TextPath Carousel -->
<text fill="#00f5ff" font-size="14px" font-weight="bold">
  <textPath xlink:href="#typePath1">&gt; FULL-STACK DEVELOPER &amp; AI EXPLORER</textPath>
</text>
<text fill="#8b5cf6" font-size="14px" font-weight="bold">
  <textPath xlink:href="#typePath2">&gt; THAPAR UNIVERSITY (TIET) ENGINEER</textPath>
</text>
<text fill="#ff007f" font-size="14px" font-weight="bold">
  <textPath xlink:href="#typePath3">&gt; BUILDING HIGH-PERFORMANCE WEB SYSTEMS</textPath>
</text>

