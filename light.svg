<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1140px" height="560px" viewBox="0 0 1140 560" font-size="15px">
<defs>
  <!-- Animated Glowing Neon Border Gradient -->
  <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0284c7"/>
    <stop offset="50%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#ec4899"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- Holographic Portrait Gradient -->
  <linearGradient id="asciiHolo" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0284c7"/>
    <stop offset="50%" stop-color="#4f46e5"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>

  <!-- Scanline Gradient -->
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
  </linearGradient>

  <!-- Neon Drop Shadow Filter -->
  <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#6366f1" flood-opacity="0.5"/>
  </filter>
</defs>

<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  -webkit-size-adjust: 109%;
  size-adjust: 109%;
}
.key {fill: #953800;}
.value {fill: #0a3069;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #8c959f;}
.neonPrompt {fill: #0284c7; font-weight: bold;}
.accentHead {fill: #ec4899; font-weight: bold;}
.quoteText {fill: #a78bfa; font-style: italic;}
.cursor {fill: #0284c7;}
text, tspan {white-space: pre;}
</style>

<!-- Outer Glowing Neon Border -->
<rect x="2" y="2" width="1136" height="556" rx="18" fill="none" stroke="url(#neonBorder)" stroke-width="2.2" filter="url(#neonGlow)"/>

<!-- Inner Solid Card Body -->
<rect x="4" y="4" width="1132" height="552" rx="16" fill="#ffffff"/>

<!-- Real Terminal Chrome Titlebar -->
<circle cx="28" cy="24" r="6" fill="#ff5f56"/>
<circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
<circle cx="68" cy="24" r="6" fill="#27c93f"/>
<text x="96" y="28" fill="#57606a" font-size="12px">puranjay@salaria:~ (zsh)</text>

<!-- Top Right Live Status Indicators -->
<circle cx="985" cy="24" r="4.5" fill="#00ff9d">
  <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="996" y="28" fill="#00ff9d" font-size="11px" font-weight="bold">ONLINE</text>
<text x="1060" y="28" fill="#57606a" font-size="12px">[utf-8]</text>

<!-- Divider Line -->
<line x1="16" y1="42" x2="1124" y2="42" stroke="#d0d7de" stroke-width="1"/>

<!-- Subtle Holographic Scanline Over Left Column -->
<line x1="24" y1="50" x2="385" y2="50" stroke="url(#scanGrad)" stroke-width="2">
  <animate attributeName="y1" values="50;530;50" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="50;530;50" dur="9s" repeatCount="indefinite"/>
</line>

